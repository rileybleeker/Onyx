name: HRV Prediction

on:
  workflow_run:
    workflows: ["Hourly Health ETL"]
    types: [completed]
  # Two UTC crons to land exactly on 23:50 ET year-round (GitHub Actions cron
  # has no DST awareness). Only one will be the correct DST-state run on any
  # given day — the dst-gate job below rejects the other.
  schedule:
    - cron: '50 3 * * *'   # 23:50 EDT (summer, UTC-4) | 22:50 EST (winter) — skipped in winter
    - cron: '50 4 * * *'   # 23:50 EST (winter, UTC-5) | 00:50 EDT (summer) — skipped in summer
  workflow_dispatch:

concurrency:
  group: hrv-prediction
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  dst-gate:
    # For scheduled runs, proceed only when the current ET hour is 23 — i.e.,
    # exactly 23:50 ET. This lets both UTC crons coexist year-round while
    # ensuring only the DST-appropriate one actually runs the prediction.
    # Non-scheduled runs (workflow_run, workflow_dispatch) always proceed.
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ET_HOUR=$(TZ=America/New_York date +%H)
          if [ "$ET_HOUR" = "23" ]; then
            echo "Scheduled run at 23:$(TZ=America/New_York date +%M) ET — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Scheduled cron fired at ET hour $ET_HOUR — wrong DST state, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  hrv-predict:
    needs: dst-gate
    runs-on: ubuntu-latest
    # Gate on dst-gate for scheduled runs; preserve the original
    # workflow_run success check for ETL-triggered runs.
    if: >
      needs.dst-gate.outputs.proceed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-hrv-${{ hashFiles('requirements-analysis.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-hrv-

      - name: Install analysis dependencies
        run: |
          pip install -r requirements-analysis.txt
          pip install supabase python-dotenv

      - name: Select the published model
        # Read-only (audit PIPE-08, hrv_model_artifact.py): the newest successful training in
        # pds.hrv_model_artifacts that this code and these packages can serve, ordered by its
        # provenance. This job never saves or publishes a model it restored; only a training run
        # (hrv-retrain-on-backfill.yml, or the missing-model step below) adds one.
        id: select
        run: python hrv_model_artifact.py select

      - name: Restore the selected model
        # Exact content key: the restored files are that artifact or nothing.
        id: model-cache
        if: steps.select.outputs.found == 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            analysis_output/xgboost_hrv_model.pkl
            analysis_output/xgboost_hrv_model.manifest.json
          key: ${{ steps.select.outputs.key }}

      - name: Restore the newest cached training (registry unreadable)
        # Degraded mode only (registry table missing, Supabase down): the most recently saved
        # TRAINING artifact. hrv_predict.py checks it against its manifest and writes a partial
        # hrv_predict|model_artifact heartbeat.
        if: steps.select.outputs.registry == 'unavailable'
        uses: actions/cache/restore@v5
        with:
          path: |
            analysis_output/xgboost_hrv_model.pkl
            analysis_output/xgboost_hrv_model.manifest.json
          key: hrv-model-${{ runner.os }}-v2-registry-unavailable
          restore-keys: |
            hrv-model-${{ runner.os }}-v2-

      - name: Restore a pre-provenance model (registry unreadable, nothing newer)
        if: steps.select.outputs.registry == 'unavailable' && hashFiles('analysis_output/xgboost_hrv_model.pkl') == ''
        uses: actions/cache/restore@v5
        with:
          path: analysis_output/xgboost_hrv_model.pkl
          key: hrv-model-${{ runner.os }}-v1-registry-unavailable
          restore-keys: |
            hrv-model-${{ runner.os }}-v1-
            hrv-model-${{ runner.os }}-

      - name: Train model if missing
        # The one training path in this workflow: nothing servable was published, or the selected
        # artifact is no longer in the cache. The model trained here is saved and published below
        # exactly like the retrain workflow's.
        id: self-train
        if: hashFiles('analysis_output/xgboost_hrv_model.pkl') == ''
        run: |
          echo "Model pickle missing - running hrv_analysis.py to retrain"
          python hrv_analysis.py --skip-analysis

      - name: Read the new model's cache key
        id: trained
        if: steps.self-train.outcome == 'success'
        run: python hrv_model_artifact.py key

      - name: Save the new model
        if: steps.trained.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            analysis_output/xgboost_hrv_model.pkl
            analysis_output/xgboost_hrv_model.manifest.json
          key: ${{ steps.trained.outputs.key }}

      - name: Confirm the new model can be restored
        id: saved
        if: steps.trained.outcome == 'success'
        uses: actions/cache/restore@v5
        with:
          path: |
            analysis_output/xgboost_hrv_model.pkl
            analysis_output/xgboost_hrv_model.manifest.json
          key: ${{ steps.trained.outputs.key }}
          lookup-only: true

      - name: Publish the new model
        # A failed publish leaves the registry unchanged and writes a partial HRV Retrain
        # heartbeat; the forecast below still runs with the model trained here.
        if: steps.trained.outcome == 'success'
        continue-on-error: true
        run: python hrv_model_artifact.py publish --saved "${{ steps.saved.outputs.cache-hit }}"

      - name: Backfill actuals & predict tomorrow
        # Never with a model from a training that failed; otherwise also after a failed key or
        # publish step, so the artifact check below reports it.
        if: ${{ !cancelled() && steps.self-train.outcome != 'failure' }}
        env:
          HRV_MODEL_REGISTRY: ${{ steps.select.outputs.registry }}
          HRV_MODEL_SELECTED_SHA256: ${{ steps.select.outputs.sha }}
          HRV_MODEL_RESTORED: ${{ steps.model-cache.outputs.cache-hit }}
        run: python hrv_predict.py --predict
