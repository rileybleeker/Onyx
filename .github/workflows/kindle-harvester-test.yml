name: Kindle Harvester Tests
on:
  workflow_run:
    workflows: ["Post-merge verify"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
jobs:
  deployed:
    uses: ./.github/workflows/deployed-revision.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
  offline-tests:
    needs: deployed
    if: needs.deployed.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node --check tools/kindle_harvest/harvest.mjs
      - run: node --test tools/kindle_harvest/harvest.test.mjs
      - run: node --check tools/kindle_harvest/amazon-orders.mjs
      - run: node --test tools/kindle_harvest/amazon-orders.test.mjs
