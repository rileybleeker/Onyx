name: Kindle Harvester Tests
on:
  pull_request:
    paths: ['tools/kindle_harvest/**', '.github/workflows/kindle-harvester-test.yml']
  push:
    branches: [master]
    paths: ['tools/kindle_harvest/**', '.github/workflows/kindle-harvester-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node --check tools/kindle_harvest/harvest.mjs
      - run: node --test tools/kindle_harvest/harvest.test.mjs
      - run: node --check tools/kindle_harvest/amazon-orders.mjs
      - run: node --test tools/kindle_harvest/amazon-orders.test.mjs
