name: Scheduled tests
# The full offline test suite, run against master on a schedule instead of on every PR (Riley 2026-11-14: one user,
# move fast; testing and deploying are independent). The per-PR gate is only `offline-checks` in autonomous-ci.yml.
#
# A failure here never blocks a merge or a deploy. It turns this run red; the cloud watchdog (SCHEDULED in
# tools/watchdog_cloud.py) and devops pick it up, and the fix ships as an ordinary PR. A master commit that already
# passed is not tested again: the gate job exits in seconds. A commit that failed is tested again on every run, so
# the red stays visible (and a flaky test shows up as a later green on the same commit).
#
# Jobs keep their old names (frontend-types, stats-tests) so history, docs and tests that name them still match.
# No job here holds a secret: stats-tests sets no SUPABASE_* variables (live tests are in live-checks.yml).
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      force:
        description: Test even if this master commit already passed
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduled-tests
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Skip a master commit that already passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          FORCE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        run: |
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scheduled-tests.yml --commit "$SHA" \
            --status success --limit 20 --json databaseId --jq length 2>/dev/null || echo 0)
          # A run whose jobs were all skipped by this gate also ends "success", but only after a real pass existed.
          if [ "$FORCE" = "true" ] || [ "${passed:-0}" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "master ${SHA:0:7} already passed; nothing to test"; fi

  frontend-types:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Offline Node tests (auto-discovered - add a test file, not a workflow line; *-ui.mjs needs a browser and is excluded)
        run: |
          shopt -s nullglob
          for f in tests/*.test.cjs; do node --test "$f"; done
          for f in scripts/test-*.mjs; do case "$f" in *-ui.mjs) continue;; esac; node "$f"; done
      - name: Status freshness regression tests (synthetic, no credentials)
        run: node test-status-freshness.cjs
      - run: npx --no-install tsc --noEmit
      - name: Compile production bundles without prerendering or production credentials
        run: npx --no-install next build --experimental-build-mode compile
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated regression browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic Today component regressions (no credentials or backend)
        working-directory: .
        run: node tests/today-regression.cjs

  stats-tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-analysis.lock
      - name: Install (pinned analysis lock + the few extras the ETL modules import)
        run: pip install -r requirements-ci.txt
      - name: Offline tests (all of tests/test_*.py except the live ones, in parallel)
        run: python tests/run_offline_tests.py
