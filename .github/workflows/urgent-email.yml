name: Urgent Email Labels

# Copies the metadata of threads that the personal-agents inbox-triage routine
# labelled Agent/Action or Agent/Deadline (both Gmail accounts) into
# pds.inbox_emails for the Today page. Read-only on Gmail (EXAMINE + BODY.PEEK);
# writes one urgent_email|labels heartbeat per run for the /status card.
# Needs sql/inbox_emails_schema.sql applied first; until then every run writes a
# 'failed' heartbeat that names the missing table.
# Manual dispatch with preview=true runs the zero-write retention preview
# (urgent_email_etl.py --preview-db; docs/email-retention-preview.md): no upsert,
# no update, no heartbeat. The shared concurrency group keeps it from
# overlapping a scheduled run.

on:
  schedule:
    # Hourly at :15. inbox-triage runs at :05 five times a day and labels within
    # ~10 minutes, so new labels reach Today within the hour. :15 keeps clear of
    # the hourly ETL (:00), retrain check (:20), flights (:25), journal (:35),
    # delivery (:40), habits (:45) and Spotify (:50).
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window in days (default 30)'
        required: false
        type: string
      preview:
        description: 'Retention preview: read Gmail + stored metadata, write nothing (no upsert/update/heartbeat)'
        required: false
        type: boolean
        default: false
      preview_refresh_limit:
        description: 'Preview only: refresh at most N window messages per account'
        required: false
        type: choice
        options: ['300', '1']
        default: '300'

concurrency:
  group: urgent-email
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  urgent-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Read Agent/Action + Agent/Deadline labels (read-only IMAP)
        shell: bash
        # Inputs reach the script only as environment variables (never pasted into the script text).
        # days is validated by bounded_days in Python; mode / limit are checked here before anything
        # runs. A schedule has no inputs: normal write mode with the 300 refresh cap.
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_DAYS}" ]; then
            args+=(--days "${INPUT_DAYS}")
          fi
          case "${INPUT_PREVIEW}" in
            true)
              case "${INPUT_PREVIEW_REFRESH_LIMIT}" in
                1|300) args+=(--preview-db --refresh-limit "${INPUT_PREVIEW_REFRESH_LIMIT}") ;;
                *) echo "::error::preview_refresh_limit must be 1 or 300"; exit 2 ;;
              esac
              ;;
            ''|false)
              case "${INPUT_PREVIEW_REFRESH_LIMIT}" in
                ''|300) ;;
                *) echo "::error::preview_refresh_limit applies only to a preview run"; exit 2 ;;
              esac
              ;;
            *) echo "::error::preview must be true or false"; exit 2 ;;
          esac
          python urgent_email_etl.py "${args[@]}"
        env:
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_PREVIEW: ${{ inputs.preview }}
          INPUT_PREVIEW_REFRESH_LIMIT: ${{ inputs.preview_refresh_limit }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          # Same mailbox slots as flights-email.yml / delivery-email.yml. An unset pair is skipped.
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          IMAP_EMAIL_2: ${{ secrets.IMAP_EMAIL_2 }}
          IMAP_APP_PASSWORD_2: ${{ secrets.IMAP_APP_PASSWORD_2 }}
          IMAP_EMAIL_3: ${{ secrets.IMAP_EMAIL_3 }}
          IMAP_APP_PASSWORD_3: ${{ secrets.IMAP_APP_PASSWORD_3 }}
          IMAP_EMAIL_4: ${{ secrets.IMAP_EMAIL_4 }}
          IMAP_APP_PASSWORD_4: ${{ secrets.IMAP_APP_PASSWORD_4 }}
          IMAP_EMAIL_5: ${{ secrets.IMAP_EMAIL_5 }}
          IMAP_APP_PASSWORD_5: ${{ secrets.IMAP_APP_PASSWORD_5 }}
