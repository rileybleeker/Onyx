name: Production Smoke Test

# Loads each dashboard page against PRODUCTION with real data and fails when a
# panel that should have data shows its empty-state fallback — the class of
# regression that tsc + lint pass but only surfaces by clicking around prod.
# A failed run = red X + GitHub's failure email. The Playwright HTML report is
# uploaded as an artifact on failure for triage.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  workflow_call: {} # post-merge.yml runs this after every merge

# A new run supersedes an in-flight one rather than piling up.
concurrency:
  group: smoke-test-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    # Pinned (not ubuntu-latest): on 2026-10-31 ubuntu-latest moved to
    # ubuntu-26.04, where Playwright 1.60 cannot install chromium's system
    # deps ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move back to ubuntu-latest once Playwright supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: npx playwright test

