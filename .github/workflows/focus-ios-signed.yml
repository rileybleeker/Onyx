name: Focus iOS signed build

# Development-signed build of the Onyx app WITH the Focus feature: the main app
# plus its embedded Device Activity monitor extension, generated from
# tools/screentime_ios/project-focus.yml. Spec: tools/screentime_ios/FOCUS.md
# ("Signing gates" and "Signed build").
#
# Differences from screentime-ios.yml (the single-profile export app):
#   - TWO provisioning profiles, one per target, set per target in a generated
#     overlay spec (never a global PROVISIONING_PROFILE_SPECIFIER override)
#   - both bundle IDs in ExportOptions provisioningProfiles
#   - the signed .app AND the embedded .appex are verified before publishing
#     (entitlements, App Group, team, device, expiry): ci/focus_signing_check.py
#   - published under screentime-focus/ so the export app's install links
#     (screentime/latest.json, shown on /install) are never overwritten
#   - portal downloads only (no App Store Connect API path)
#
# THIS REPOSITORY IS PUBLIC: workflow logs and artifacts are world-readable.
# This job uploads NO artifacts and never prints the device UDID, signed URLs
# or install links.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the signed Focus build for over-the-air install (private bucket, screentime-focus/)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: focus-ios-signed
  cancel-in-progress: true

jobs:
  signed:
    name: Signed Focus development build
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MAIN_BUNDLE_ID: com.rileybleeker.onyxscreentime
      MONITOR_BUNDLE_ID: com.rileybleeker.onyxscreentime.focusmonitor
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # Same key as screentime-ios.yml (~/.onyx-ios-signing/onyx_dev.key on Riley's PC).
      - name: Prepare signing key
        env:
          IOS_DEV_KEY_B64: ${{ secrets.IOS_DEV_KEY_B64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SIGN_DIR"
          chmod 700 "$SIGN_DIR"
          KEY_PEM="$SIGN_DIR/onyx_dev.key"
          fail() { echo "::error title=$1::$2"; exit 1; }
          [ -n "${IOS_DEV_KEY_B64:-}" ] || fail "Signing key" "The IOS_DEV_KEY_B64 secret is not set."

          printf '%s' "$IOS_DEV_KEY_B64" | tr -d '[:space:]' | base64 --decode | tr -d '\r' > "$KEY_PEM"
          chmod 600 "$KEY_PEM"
          if [ "$(head -n 1 "$KEY_PEM")" = "-----BEGIN PRIVATE KEY-----" ]; then
            /usr/bin/openssl rsa -traditional -in "$KEY_PEM" -out "$KEY_PEM.pkcs1" 2>/dev/null \
              || /usr/bin/openssl rsa -in "$KEY_PEM" -out "$KEY_PEM.pkcs1"
            mv "$KEY_PEM.pkcs1" "$KEY_PEM"
          fi
          [ "$(head -n 1 "$KEY_PEM")" = "-----BEGIN RSA PRIVATE KEY-----" ] \
            || fail "Signing key" "IOS_DEV_KEY_B64 must be the base64 of an unencrypted PEM RSA private key."

      # Portal downloads only: the certificate and one profile per target.
      - name: Decode certificate and both provisioning profiles
        env:
          IOS_DEV_CERT_B64: ${{ secrets.IOS_DEV_CERT_B64 }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          IOS_FOCUS_MONITOR_PROFILE_B64: ${{ secrets.IOS_FOCUS_MONITOR_PROFILE_B64 }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=$1::$2"; exit 1; }
          [ -n "${IOS_DEV_CERT_B64:-}" ] || fail "Signing material missing" "The IOS_DEV_CERT_B64 secret is not set (Apple Development certificate, see tools/screentime_ios/README.md)."
          [ -n "${IOS_PROFILE_B64:-}" ] || fail "Signing material missing" "The IOS_PROFILE_B64 secret is not set: create the iOS App Development profile for com.rileybleeker.onyxscreentime (with App Groups ticked) and set it."
          [ -n "${IOS_FOCUS_MONITOR_PROFILE_B64:-}" ] || fail "Signing material missing" "The IOS_FOCUS_MONITOR_PROFILE_B64 secret is not set: register the App ID com.rileybleeker.onyxscreentime.focusmonitor (Family Controls (Development) + App Groups with group.com.rileybleeker.onyxscreentime.focus), create its iOS App Development profile with the certificate and the iPhone, then set the secret (tools/screentime_ios/FOCUS.md, Signed build)."

          printf '%s' "$IOS_DEV_CERT_B64" | tr -d '[:space:]' | base64 --decode > "$SIGN_DIR/cert.in"
          if grep -q -- "-----BEGIN CERTIFICATE-----" "$SIGN_DIR/cert.in"; then
            /usr/bin/openssl x509 -in "$SIGN_DIR/cert.in" -outform DER -out "$SIGN_DIR/onyx_dev.cer"
          else
            cp "$SIGN_DIR/cert.in" "$SIGN_DIR/onyx_dev.cer"
          fi
          printf '%s' "$IOS_PROFILE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGN_DIR/main.mobileprovision"
          printf '%s' "$IOS_FOCUS_MONITOR_PROFILE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGN_DIR/monitor.mobileprovision"
          [ -s "$SIGN_DIR/onyx_dev.cer" ] || fail "Signing certificate" "The certificate file is empty."
          [ -s "$SIGN_DIR/main.mobileprovision" ] || fail "Provisioning profile" "IOS_PROFILE_B64 decodes to an empty file."
          [ -s "$SIGN_DIR/monitor.mobileprovision" ] || fail "Provisioning profile" "IOS_FOCUS_MONITOR_PROFILE_B64 decodes to an empty file."

      - name: Import signing identity into a temporary keychain
        run: |
          set -euo pipefail
          KEY_PEM="$SIGN_DIR/onyx_dev.key"
          CERT_DER="$SIGN_DIR/onyx_dev.cer"
          fail() { echo "::error title=$1::$2"; exit 1; }

          # the certificate must belong to our key
          CERT_MOD="$(/usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -modulus | /usr/bin/openssl sha256)"
          KEY_MOD="$(/usr/bin/openssl rsa -in "$KEY_PEM" -noout -modulus | /usr/bin/openssl sha256)"
          [ "$CERT_MOD" = "$KEY_MOD" ] || fail "Signing identity" "The certificate was not issued for the private key in IOS_DEV_KEY_B64. Create the certificate from ~/.onyx-ios-signing/onyx_dev.certSigningRequest, re-create both profiles with that certificate, then set IOS_DEV_CERT_B64, IOS_PROFILE_B64 and IOS_FOCUS_MONITOR_PROFILE_B64 again."
          /usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -enddate
          /usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -checkend 86400 > /dev/null \
            || fail "Signing certificate expired" "The Apple Development certificate in IOS_DEV_CERT_B64 has expired (or expires within a day): create a new one from ~/.onyx-ios-signing/onyx_dev.certSigningRequest, re-create both profiles with it, and set the three secrets again."
          /usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -checkend $((30*86400)) > /dev/null \
            || echo "::warning title=Signing certificate::The signing certificate expires within 30 days (date above). Create a new Apple Development certificate and both profiles before relying on this build."

          KEYCHAIN_PATH="$RUNNER_TEMP/onyx-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # key first, then certificate; no .p12 involved (avoids the OpenSSL 3 / macOS PKCS#12 mismatch)
          security import "$KEY_PEM"  -k "$KEYCHAIN_PATH" -t priv -f openssl -P "" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CERT_DER" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          EXISTING="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          read_identity() {
            IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
            echo "$IDENTITIES" | tail -n 1
            IDENTITY_SHA1="$(sed -n 's/^ *1) \([0-9A-F]\{40\}\) ".*"$/\1/p' <<< "$IDENTITIES")"
            IDENTITY_NAME="$(sed -n 's/^ *1) [0-9A-F]\{40\} "\(.*\)"$/\1/p' <<< "$IDENTITIES")"
          }
          read_identity
          if [ -z "$IDENTITY_SHA1" ]; then
            # Apple TN3161: missing WWDR intermediate. GitHub images preinstall G3; this is the fallback.
            curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGN_DIR/AppleWWDRCAG3.cer"
            security import "$SIGN_DIR/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
            read_identity
          fi
          [ -n "$IDENTITY_SHA1" ] || fail "Signing identity" "No valid code-signing identity in the temporary keychain (expired or revoked certificate, or key and certificate did not pair)."

          cp /usr/bin/true "$SIGN_DIR/signtest"
          codesign -f --keychain "$KEYCHAIN_PATH" -s "$IDENTITY_SHA1" "$SIGN_DIR/signtest" \
            || fail "Signing identity" "codesign could not use the imported key (keychain locked or partition list not set)."

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IDENTITY_SHA1=$IDENTITY_SHA1"
            echo "IDENTITY_NAME=$IDENTITY_NAME"
          } >> "$GITHUB_ENV"

      # Before the build: both profiles vs the App IDs, App Group, Family Controls,
      # certificate, team, iPhone and expiry. Every missing portal step is reported.
      # Writes TEAM_ID, MAIN_/MONITOR_PROFILE_UUID/_NAME and PROFILE_EXPIRES to the env.
      - name: Check and install both provisioning profiles
        env:
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=$1::$2"; exit 1; }
          for P in main monitor; do
            security cms -D -i "$SIGN_DIR/$P.mobileprovision" -o "$SIGN_DIR/$P.plist" 2>/dev/null \
              || fail "Provisioning profile" "The $P profile secret does not decode as a .mobileprovision (IOS_PROFILE_B64 = main, IOS_FOCUS_MONITOR_PROFILE_B64 = monitor)."
          done
          python3 tools/screentime_ios/ci/focus_signing_check.py profiles \
            --main-profile "$SIGN_DIR/main.plist" \
            --monitor-profile "$SIGN_DIR/monitor.plist" \
            --cert "$SIGN_DIR/onyx_dev.cer" \
            --cert-not-after "$(/usr/bin/openssl x509 -inform DER -in "$SIGN_DIR/onyx_dev.cer" -noout -enddate)"

          # Xcode 16+ location, plus the legacy one; file name = <UUID>.mobileprovision
          MAIN_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/main.plist")"
          MONITOR_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/monitor.plist")"
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$SIGN_DIR/main.mobileprovision" "$DIR/$MAIN_UUID.mobileprovision"
            cp "$SIGN_DIR/monitor.mobileprovision" "$DIR/$MONITOR_UUID.mobileprovision"
          done

      # Per-target signing: a throwaway overlay spec (never committed) that includes
      # project-focus.yml unchanged and adds each target's own profile. XcodeGen
      # merges target settings, so everything else comes from the committed specs.
      - name: Generate Xcode project (project-focus.yml + per-target signing)
        working-directory: tools/screentime_ios
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 - <<'PY'
          import json, os
          q = json.dumps  # a JSON string is a valid YAML scalar: safe quoting for profile names
          def target(name, profile):
              return (f"  {name}:\n    settings:\n      base:\n"
                      f"        CODE_SIGN_STYLE: Manual\n"
                      f"        DEVELOPMENT_TEAM: {q(os.environ['TEAM_ID'])}\n"
                      f"        PROVISIONING_PROFILE_SPECIFIER: {q(profile)}\n")
          spec = ("# generated by focus-ios-signed.yml on the runner; not committed\n"
                  "include:\n  - project-focus.yml\ntargets:\n"
                  + target("OnyxScreenTime", os.environ["MAIN_PROFILE_NAME"])
                  + target("OnyxFocusMonitor", os.environ["MONITOR_PROFILE_NAME"]))
          open("project-focus-signed.generated.yml", "w").write(spec)
          PY
          xcodegen generate --spec project-focus-signed.generated.yml

      - name: Confirm per-target signing settings
        working-directory: tools/screentime_ios
        run: |
          set -euo pipefail
          fail() { echo "::error title=$1::$2"; exit 1; }
          setting() { sed -n "s/^ *$1 = //p" "$2" | head -n 1; }
          for T in OnyxScreenTime OnyxFocusMonitor; do
            xcodebuild -showBuildSettings -project OnyxScreenTime.xcodeproj -target "$T" -configuration Release \
              CODE_SIGN_IDENTITY="$IDENTITY_NAME" 2>/dev/null > "$RUNNER_TEMP/settings-$T.txt"               || fail "Project" "xcodebuild -showBuildSettings failed for $T."
            grep -E '^ +(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS) = ' "$RUNNER_TEMP/settings-$T.txt" | sed "s/^ */$T: /" || true
          done
          [ "$(setting PRODUCT_BUNDLE_IDENTIFIER "$RUNNER_TEMP/settings-OnyxScreenTime.txt")" = "$MAIN_BUNDLE_ID" ] || fail "Project" "OnyxScreenTime does not build $MAIN_BUNDLE_ID."
          [ "$(setting PRODUCT_BUNDLE_IDENTIFIER "$RUNNER_TEMP/settings-OnyxFocusMonitor.txt")" = "$MONITOR_BUNDLE_ID" ] || fail "Project" "OnyxFocusMonitor does not build $MONITOR_BUNDLE_ID."
          [ "$(setting PROVISIONING_PROFILE_SPECIFIER "$RUNNER_TEMP/settings-OnyxScreenTime.txt")" = "$MAIN_PROFILE_NAME" ] || fail "Project" "OnyxScreenTime is not set to the main app profile."
          [ "$(setting PROVISIONING_PROFILE_SPECIFIER "$RUNNER_TEMP/settings-OnyxFocusMonitor.txt")" = "$MONITOR_PROFILE_NAME" ] || fail "Project" "OnyxFocusMonitor is not set to the focus monitor profile."
          [ "$(setting CODE_SIGN_STYLE "$RUNNER_TEMP/settings-OnyxFocusMonitor.txt")" = "Manual" ] || fail "Project" "OnyxFocusMonitor is not manually signed."

      # No PROVISIONING_PROFILE_SPECIFIER on this command line: it would apply to
      # every target (and the FocusCore package). Team, style and identity are the
      # same for every target, as in screentime-ios.yml.
      - name: Archive (manual signing, per-target profiles)
        working-directory: tools/screentime_ios
        run: |
          set -o pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/OnyxFocus.xcarchive"
          xcodebuild archive \
            -project OnyxScreenTime.xcodeproj \
            -scheme OnyxScreenTime \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY_NAME" \
            2>&1 | tee archive.log | grep -E "error:|warning: unre|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            echo "::error title=Archive failed::xcodebuild archive did not succeed; the last lines of the log follow."
            tail -n 60 archive.log
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export .ipa (both bundle IDs mapped)
        working-directory: tools/screentime_ios
        run: |
          set -o pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          python3 -c 'import os, plistlib; e = os.environ; plistlib.dump({"method": "debugging", "destination": "export", "signingStyle": "manual", "teamID": e["TEAM_ID"], "signingCertificate": e["IDENTITY_SHA1"], "provisioningProfiles": {e["MAIN_BUNDLE_ID"]: e["MAIN_PROFILE_UUID"], e["MONITOR_BUNDLE_ID"]: e["MONITOR_PROFILE_UUID"]}, "thinning": "<none>", "stripSwiftSymbols": True}, open(e["RUNNER_TEMP"] + "/ExportOptions.plist", "wb"))'
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          if ! grep -q "EXPORT SUCCEEDED" export.log; then
            echo "::error title=Export failed::xcodebuild -exportArchive did not succeed; the last lines of the log follow."
            tail -n 60 export.log
            exit 1
          fi

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=Export::No .ipa in the export folder"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          ls -la "$IPA_PATH"
          {
            echo "EXPORT_PATH=$EXPORT_PATH"
            echo "IPA_PATH=$IPA_PATH"
          } >> "$GITHUB_ENV"

      # The signed .app AND the embedded .appex: signature, claimed entitlements,
      # embedded profiles (the ones we supplied), App Group, team, iPhone, expiry.
      - name: Verify the signed app and the embedded extension
        env:
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=$1::$2"; exit 1; }
          V="$RUNNER_TEMP/verify"
          rm -rf "$V"; mkdir -p "$V"
          unzip -q "$IPA_PATH" -d "$V"
          APP="$(find "$V/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || fail "Export" "No .app inside the .ipa Payload folder."
          APPEX_COUNT="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' 2>/dev/null | wc -l | tr -d ' ' || true)"
          [ "$APPEX_COUNT" = "1" ] || fail "Export" "Expected exactly one extension in the app's PlugIns folder, found $APPEX_COUNT. The focus monitor was not embedded."
          APPEX="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$MAIN_BUNDLE_ID" ] || fail "Export" "The app is not $MAIN_BUNDLE_ID."
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")" = "$MONITOR_BUNDLE_ID" ] || fail "Export" "The embedded extension is not $MONITOR_BUNDLE_ID."

          codesign --verify --deep --strict --verbose=2 "$APP" || fail "Signature" "codesign --verify failed for the app or its extension."
          codesign --verify --strict --verbose=2 "$APPEX" || fail "Signature" "codesign --verify failed for the focus monitor extension."

          for PAIR in "main:$APP" "monitor:$APPEX"; do
            P="${PAIR%%:*}"; B="${PAIR#*:}"
            codesign -d --entitlements - --xml "$B" 2>/dev/null | plutil -convert xml1 -o "$V/$P-entitlements.plist" - \
              || fail "Entitlements" "The signed $P bundle carries no readable entitlements."
            security cms -D -i "$B/embedded.mobileprovision" -o "$V/$P-embedded.plist" 2>/dev/null \
              || fail "Embedded profile" "No decodable embedded.mobileprovision in the $P bundle."
          done

          python3 tools/screentime_ios/ci/focus_signing_check.py signed \
            --main-ents "$V/main-entitlements.plist" --main-profile "$V/main-embedded.plist" \
            --monitor-ents "$V/monitor-entitlements.plist" --monitor-profile "$V/monitor-embedded.plist" \
            --cert "$SIGN_DIR/onyx_dev.cer" --team "$TEAM_ID" \
            --main-uuid "$MAIN_PROFILE_UUID" --monitor-uuid "$MONITOR_PROFILE_UUID"

      # Private bucket, folder screentime-focus/ (never screentime/latest.json, which
      # is the export app's /install entry). No artifact, no links in the log.
      - name: Publish for over-the-air install
        if: ${{ inputs.publish }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECT_BUNDLE_ID: ${{ env.MAIN_BUNDLE_ID }}
          PUBLISH_PREFIX: screentime-focus
        run: python3 tools/screentime_ios/ci/publish_build.py

      - name: Clean up keychain and profiles
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/onyx-signing.keychain-db" || true
          for U in "${MAIN_PROFILE_UUID:-none}" "${MONITOR_PROFILE_UUID:-none}"; do
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$U.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/$U.mobileprovision"
          done
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/verify" "$RUNNER_TEMP/export"
