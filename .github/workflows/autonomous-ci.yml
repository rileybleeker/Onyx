name: Autonomous CI
# The ONLY per-PR gate (Riley 2026-11-14: one user, move fast; test on a schedule; testing and deploying are
# independent). offline-checks takes about 10 s: Python parses, the HRV clock-boundary tests and the merge-guard and
# merge-train decision tests. Everything slower (Node tests, tsc, compile build, browser regressions, the Python stats
# suite) runs in scheduled-tests.yml against master. A type error cannot reach production anyway: Vercel's
# `next build` type-checks, a failed Production build deploys nothing, and post-merge verify reverts the merge.
run-name: Autonomous CI ${{ inputs.sha || github.sha }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Immutable commit to test (defaults to event commit)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: autonomous-ci-${{ inputs.sha || github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    # A pinned checkout must not satisfy required checks on the dispatch ref.
    name: ${{ inputs.sha && 'offline-checks-pinned' || 'offline-checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Parse tracked Python without importing production modules
        run: |
          python - <<'PY'
          import ast, subprocess
          for path in subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines():
              with open(path, encoding='utf-8-sig') as stream:
                  ast.parse(stream.read(), filename=path)
          PY
      - name: HRV behavioral clock boundary tests
        run: python tests/test_hrv_clock_boundaries.py
      - name: Autonomous merge guard unit tests (no credentials or network)
        run: python -m unittest discover -s tests -p test_autonomous_merge.py -v
      - name: Merge train decision tests (no credentials or network)
        run: python -m unittest discover -s tests -p test_merge_train.py -v
