name: Autonomous CI
# Required compatibility check now performs syntax/build validation only, not automated tests.
# Behavioral tests run after verified Production deployment in scheduled-tests.yml.
run-name: Autonomous CI ${{ inputs.sha || github.sha }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Immutable commit to test (defaults to event commit)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: autonomous-ci-${{ inputs.sha || github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    # A pinned checkout must not satisfy required checks on the dispatch ref.
    name: ${{ inputs.sha && 'offline-checks-pinned' || 'offline-checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Parse tracked Python without importing production modules
        run: |
          python - <<'PY'
          import ast, subprocess
          for path in subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines():
              with open(path, encoding='utf-8-sig') as stream:
                  ast.parse(stream.read(), filename=path)
          PY
