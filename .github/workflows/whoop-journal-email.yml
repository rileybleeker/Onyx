name: WHOOP Journal Email Check

# DECOMMISSIONED 2026-06-11: the WHOOP in-app journal was replaced by the
# Onyx habits system (WHOOP history merged into pds.habit_journal — see
# sql/whoop_journal_merge.sql). Cron schedule removed; workflow_dispatch kept
# as a manual fallback should a final WHOOP export ever need importing
# (same pattern as the MFP → Cronometer cutover in mfp-email.yml).
# NOTE: pds.whoop_journal is a frozen archive — a manual run would now write
# to a table nothing reads. Only use after un-freezing deliberately.
on:
  workflow_dispatch: # Manual trigger (fallback only)

concurrency:
  group: whoop-journal-email
  cancel-in-progress: false

jobs:
  whoop-journal-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests supabase python-dotenv
      - name: Check WHOOP journal email
        run: python whoop_journal_email.py --once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
