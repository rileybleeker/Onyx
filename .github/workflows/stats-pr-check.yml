name: Stats Tests (PR check)

# Offline, credential-free unit tests for the HRV pipeline and the ETL helpers.
#
# This job holds NO secrets and sets NO SUPABASE_* variables. A pull request can edit tests/
# or this very file, so anything it can reach would be exposed to unreviewed code; nothing
# here can reach production. Tests that need the live database (tests/test_hrv_alignment_live.py,
# tests/test_habit_rename.py) run in live-checks.yml on master / on a schedule instead.
#
# What runs: every tests/test_*.py except the live ones, discovered and run in parallel by
# tests/run_offline_tests.py (the single place that lists exclusions). See docs/ci-checks.md.

on:
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "frontend/src/**"        # tests/test_tdee_source_guard.py scans the TypeScript sources
      - "requirements*"
      - ".github/workflows/stats-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nothing here touches shared state, so a newer push simply replaces the older run.
concurrency:
  group: stats-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is referenced by merge tooling; keep it stable.
  stats-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Parse-check Python modules (fails fast, before the install)
        run: |
          python3 -c "import ast; [ast.parse(open(p).read()) for p in (
            'hrv_analysis.py','hrv_predict.py','hrv_alignment.py','causal_inference.py',
            'garmin_etl.py','whoop_etl.py','eight_sleep_etl.py','spotify_etl.py',
            'whoop_tz_backfill.py',
          )]; print('all .py modules parse cleanly')"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-analysis.lock

      - name: Install (pinned analysis lock + the few extras the ETL modules import)
        run: pip install -r requirements-ci.txt

      - name: Offline tests (all of tests/test_*.py except the live ones, in parallel)
        run: python tests/run_offline_tests.py
