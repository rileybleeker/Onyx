name: Screen Time iOS app

# Builds tools/screentime_ios (the Onyx Screen Time iPhone app). Riley has no
# Mac, so this runner is the only compiler and signer the app ever sees.
#
#   push (app files changed)  -> compile: UNSIGNED build, proves the code compiles
#   Run workflow (manual)     -> signed:  development-signed .ipa for Riley's one
#                                registered iPhone, published for over-the-air
#                                install via the Onyx /install page
#
# THIS REPOSITORY IS PUBLIC: workflow logs and artifacts are world-readable.
# The signed job therefore uploads NO artifacts and never prints the device
# UDID, signed URLs or install links. See tools/screentime_ios/README.md.

on:
  push:
    branches: [master]
    paths:
      - "tools/screentime_ios/**"
      - ".github/workflows/screentime-ios.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the signed build for over-the-air install (Onyx /install page)"
        type: boolean
        default: true

concurrency:
  group: screentime-ios-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (unsigned)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        working-directory: tools/screentime_ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: tools/screentime_ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OnyxScreenTime.xcodeproj \
            -scheme OnyxScreenTime \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screentime-ios-build-log
          path: tools/screentime_ios/build.log
          retention-days: 7

  signed:
    name: Signed development build
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUNDLE_ID: com.rileybleeker.onyxscreentime
      REQUIRED_ENTITLEMENTS: com.apple.developer.family-controls,com.apple.developer.family-controls.app-and-website-usage
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # The development private key was generated once on Riley's PC
      # (~/.onyx-ios-signing/onyx_dev.key) and stored as IOS_DEV_KEY_B64.
      - name: Prepare signing key
        env:
          IOS_DEV_KEY_B64: ${{ secrets.IOS_DEV_KEY_B64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"
          chmod 700 "$SIGN_DIR"
          KEY_PEM="$SIGN_DIR/onyx_dev.key"
          fail() { echo "::error title=$1::$2"; exit 1; }
          [ -n "${IOS_DEV_KEY_B64:-}" ] || fail "Signing key" "The IOS_DEV_KEY_B64 secret is not set."

          # PEM, unencrypted, PKCS#1 ("BEGIN RSA PRIVATE KEY") is what 'security import -f openssl' reads
          printf '%s' "$IOS_DEV_KEY_B64" | tr -d '[:space:]' | base64 --decode | tr -d '\r' > "$KEY_PEM"
          chmod 600 "$KEY_PEM"
          if [ "$(head -n 1 "$KEY_PEM")" = "-----BEGIN PRIVATE KEY-----" ]; then
            # PKCS#8 -> PKCS#1. OpenSSL 3+ needs -traditional; LibreSSL has no such flag and writes PKCS#1 by default.
            /usr/bin/openssl rsa -traditional -in "$KEY_PEM" -out "$KEY_PEM.pkcs1" 2>/dev/null \
              || /usr/bin/openssl rsa -in "$KEY_PEM" -out "$KEY_PEM.pkcs1"
            mv "$KEY_PEM.pkcs1" "$KEY_PEM"
          fi
          [ "$(head -n 1 "$KEY_PEM")" = "-----BEGIN RSA PRIVATE KEY-----" ] \
            || fail "Signing key" "IOS_DEV_KEY_B64 must be the base64 of an unencrypted PEM RSA private key."

      # Two ways to get the certificate + provisioning profile:
      #   1. portal:  IOS_DEV_CERT_B64 + IOS_PROFILE_B64 (files Riley downloaded from developer.apple.com)
      #   2. API:     ASC_KEY_ID + ASC_ISSUER_ID + ASC_KEY_P8 + IPHONE_UDID (App Store Connect team key)
      # The portal files win when both are present.
      - name: Obtain certificate and provisioning profile
        env:
          IOS_DEV_CERT_B64: ${{ secrets.IOS_DEV_CERT_B64 }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVICE_UDID: ${{ secrets.IPHONE_UDID }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          fail() { echo "::error title=$1::$2"; exit 1; }

          if [ -n "${IOS_DEV_CERT_B64:-}" ] && [ -n "${IOS_PROFILE_B64:-}" ]; then
            echo "Using the certificate and profile downloaded from the developer portal."
            printf '%s' "$IOS_DEV_CERT_B64" | tr -d '[:space:]' | base64 --decode > "$SIGN_DIR/cert.in"
            if grep -q -- "-----BEGIN CERTIFICATE-----" "$SIGN_DIR/cert.in"; then
              /usr/bin/openssl x509 -in "$SIGN_DIR/cert.in" -outform DER -out "$SIGN_DIR/onyx_dev.cer"
            else
              cp "$SIGN_DIR/cert.in" "$SIGN_DIR/onyx_dev.cer"
            fi
            printf '%s' "$IOS_PROFILE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGN_DIR/profile.mobileprovision"
          elif [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ] && [ -n "${ASC_KEY_P8:-}" ] && [ -n "${DEVICE_UDID:-}" ]; then
            echo "Using the App Store Connect API."
            # Pin OpenSSL 3 for the helper when Homebrew has it (the image's default is moving to 4.x).
            OPENSSL_BIN="$(brew --prefix openssl@3 2>/dev/null || true)/bin/openssl"
            [ -x "$OPENSSL_BIN" ] || OPENSSL_BIN="openssl"
            mkdir -p "$SIGN_DIR/asc"
            OPENSSL_BIN="$OPENSSL_BIN" \
            OUT_DIR="$SIGN_DIR/asc" \
            DEV_KEY_PEM_PATH="$SIGN_DIR/onyx_dev.key" \
            BUNDLE_NAME="Onyx Screen Time" \
            DEVICE_NAME="iPhone" \
            PROFILE_NAME="Onyx Screen Time Dev CI" \
              python3 tools/screentime_ios/ci/asc_signing.py
            cp "$SIGN_DIR/asc/development.cer" "$SIGN_DIR/onyx_dev.cer"
            PROFILE_FILE="$(find "$SIGN_DIR/asc" -maxdepth 1 -name '*.mobileprovision' -print -quit)"
            [ -n "$PROFILE_FILE" ] || fail "Provisioning profile" "The App Store Connect helper wrote no profile."
            cp "$PROFILE_FILE" "$SIGN_DIR/profile.mobileprovision"
          else
            fail "Signing material missing" "Set IOS_DEV_CERT_B64 + IOS_PROFILE_B64 (portal downloads), or ASC_KEY_ID + ASC_ISSUER_ID + ASC_KEY_P8 + IPHONE_UDID (App Store Connect API). See tools/screentime_ios/README.md."
          fi
          [ -s "$SIGN_DIR/onyx_dev.cer" ] || fail "Signing certificate" "The certificate file is empty."
          [ -s "$SIGN_DIR/profile.mobileprovision" ] || fail "Provisioning profile" "The profile file is empty."

      - name: Import signing identity into a temporary keychain
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          KEY_PEM="$SIGN_DIR/onyx_dev.key"
          CERT_DER="$SIGN_DIR/onyx_dev.cer"
          fail() { echo "::error title=$1::$2"; exit 1; }

          # the certificate must belong to our key
          CERT_MOD="$(/usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -modulus | /usr/bin/openssl sha256)"
          KEY_MOD="$(/usr/bin/openssl rsa -in "$KEY_PEM" -noout -modulus | /usr/bin/openssl sha256)"
          [ "$CERT_MOD" = "$KEY_MOD" ] || fail "Signing identity" "The certificate was not issued for the private key in IOS_DEV_KEY_B64. Upload ~/.onyx-ios-signing/onyx_dev.certSigningRequest when creating the certificate."
          /usr/bin/openssl x509 -inform DER -in "$CERT_DER" -noout -enddate

          KEYCHAIN_PATH="$RUNNER_TEMP/onyx-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -l lock on sleep, -u lock after the -t timeout: 6 hours, far longer than this job
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # key first, then certificate; no .p12 involved (avoids the OpenSSL 3 / macOS PKCS#12 mismatch)
          security import "$KEY_PEM"  -k "$KEYCHAIN_PATH" -t priv -f openssl -P "" -T /usr/bin/codesign -T /usr/bin/security
          security import "$CERT_DER" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          # let codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # put the keychain on the user search list (keep the existing ones)
          EXISTING="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          read_identity() {
            IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
            echo "$IDENTITIES" | tail -n 1    # the count line only: public logs
            IDENTITY_SHA1="$(sed -n 's/^ *1) \([0-9A-F]\{40\}\) ".*"$/\1/p' <<< "$IDENTITIES")"
            IDENTITY_NAME="$(sed -n 's/^ *1) [0-9A-F]\{40\} "\(.*\)"$/\1/p' <<< "$IDENTITIES")"
          }
          read_identity
          if [ -z "$IDENTITY_SHA1" ]; then
            # most common cause (Apple TN3161): missing WWDR intermediate. GitHub images preinstall G3; this is the fallback.
            curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGN_DIR/AppleWWDRCAG3.cer"
            security import "$SIGN_DIR/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
            read_identity
          fi
          [ -n "$IDENTITY_SHA1" ] || fail "Signing identity" "No valid code-signing identity in the temporary keychain (expired or revoked certificate, or key and certificate did not pair)."

          # smoke test: codesign must be able to use the key with no prompt, before the long build starts
          cp /usr/bin/true "$SIGN_DIR/signtest"
          codesign -f --keychain "$KEYCHAIN_PATH" -s "$IDENTITY_SHA1" "$SIGN_DIR/signtest" \
            || fail "Signing identity" "codesign could not use the imported key (keychain locked or partition list not set)."

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IDENTITY_SHA1=$IDENTITY_SHA1"
            echo "IDENTITY_NAME=$IDENTITY_NAME"
          } >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          PROFILE_SRC="$SIGN_DIR/profile.mobileprovision"
          PROFILE_PLIST="$SIGN_DIR/profile.plist"
          PB=/usr/libexec/PlistBuddy
          fail() { echo "::error title=$1::$2"; exit 1; }

          security cms -D -i "$PROFILE_SRC" -o "$PROFILE_PLIST" 2>/dev/null \
            || fail "Provisioning profile" "security cms -D could not decode the profile (not a .mobileprovision?)."
          PROFILE_UUID="$($PB -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$($PB -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$($PB -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APP_ID="$($PB -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_EXPIRES="$(plutil -extract ExpirationDate raw -o - "$PROFILE_PLIST")"
          echo "profile: $PROFILE_NAME, expires $PROFILE_EXPIRES"
          [ "$APP_ID" = "$TEAM_ID.$BUNDLE_ID" ] || fail "Provisioning profile" "Profile is for $APP_ID, expected $TEAM_ID.$BUNDLE_ID."
          [ "$($PB -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)" = "true" ] \
            || fail "Provisioning profile" "Not a development profile (get-task-allow is not true). Family Controls (Development) needs an 'iOS App Development' profile."

          # fail early if the App ID capabilities were not ticked before the profile was created
          IFS=',' read -r -a ENTS <<< "$REQUIRED_ENTITLEMENTS"
          for ENT in "${ENTS[@]}"; do
            VAL="$($PB -c "Print :Entitlements:$ENT" "$PROFILE_PLIST" 2>/dev/null || true)"
            [ "$VAL" = "true" ] || fail "Provisioning profile lacks $ENT" "Tick the Family Controls capabilities on the App ID in the developer portal, then delete and re-create the development profile."
          done

          # Xcode 16+ location, plus the legacy one; file name = <UUID>.mobileprovision
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE_SRC" "$DIR/$PROFILE_UUID.mobileprovision"
          done

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_EXPIRES=$PROFILE_EXPIRES"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: tools/screentime_ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (manual signing)
        working-directory: tools/screentime_ios
        run: |
          set -o pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/OnyxScreenTime.xcarchive"

          # informational: what the command-line overrides resolve to
          xcodebuild -showBuildSettings \
            -project OnyxScreenTime.xcodeproj \
            -scheme OnyxScreenTime \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>/dev/null | grep -E '^ +(CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS) = ' || true

          xcodebuild archive \
            -project OnyxScreenTime.xcodeproj \
            -scheme OnyxScreenTime \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee archive.log | grep -E "error:|warning: unre|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            echo "::error title=Archive failed::xcodebuild archive did not succeed; the last lines of the log follow."
            tail -n 60 archive.log
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export .ipa
        working-directory: tools/screentime_ios
        run: |
          set -o pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"

          # "debugging" is the current name of the development export method (Xcode 15.3+)
          python3 -c 'import os, plistlib; plistlib.dump({"method": "debugging", "destination": "export", "signingStyle": "manual", "teamID": os.environ["TEAM_ID"], "signingCertificate": os.environ["IDENTITY_SHA1"], "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]}, "thinning": "<none>", "stripSwiftSymbols": True}, open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb"))'
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          if ! grep -q "EXPORT SUCCEEDED" export.log; then
            echo "::error title=Export failed::xcodebuild -exportArchive did not succeed; the last lines of the log follow."
            tail -n 60 export.log
            exit 1
          fi

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=Export::No .ipa in the export folder"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          ls -la "$IPA_PATH"
          {
            echo "EXPORT_PATH=$EXPORT_PATH"
            echo "IPA_PATH=$IPA_PATH"
          } >> "$GITHUB_ENV"

      - name: Verify the exported .ipa
        env:
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
        run: |
          set -euo pipefail
          PB=/usr/libexec/PlistBuddy
          fail() { echo "::error title=$1::$2"; exit 1; }
          V="$RUNNER_TEMP/verify"
          rm -rf "$V"; mkdir -p "$V"
          unzip -q "$IPA_PATH" -d "$V"
          APP="$(find "$V/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || fail "Export" "No .app inside the .ipa Payload folder."

          # 1. the signature itself
          codesign --verify --strict --verbose=2 "$APP" || fail "Signature" "codesign --verify failed"

          # 2. entitlements the app CLAIMS (in its code signature)
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert xml1 -o "$V/app-entitlements.plist" - \
            || fail "Entitlements" "The signed app carries no readable entitlements."
          IFS=',' read -r -a ENTS <<< "$REQUIRED_ENTITLEMENTS"
          for ENT in "${ENTS[@]}"; do
            VAL="$($PB -c "Print :$ENT" "$V/app-entitlements.plist" 2>/dev/null || true)"
            [ "$VAL" = "true" ] || fail "Entitlement missing from the signed app" "$ENT is not in the code signature. The build cannot read Screen Time data."
            echo "app claims $ENT"
          done

          # 3. what the embedded profile ALLOWS
          security cms -D -i "$APP/embedded.mobileprovision" -o "$V/embedded.plist" 2>/dev/null \
            || fail "Embedded profile" "No decodable embedded.mobileprovision in the app."
          for ENT in "${ENTS[@]}"; do
            VAL="$($PB -c "Print :Entitlements:$ENT" "$V/embedded.plist" 2>/dev/null || true)"
            [ "$VAL" = "true" ] || fail "Entitlement missing from the embedded profile" "$ENT is not allowed by the embedded profile. Tick the capability on the App ID and re-create the profile."
            echo "profile allows $ENT"
          done
          [ "$($PB -c 'Print :Entitlements:get-task-allow' "$V/embedded.plist" 2>/dev/null || true)" = "true" ] \
            || fail "Profile type" "The embedded profile is not a development profile."

          # 4. the iPhone is in the profile (the UDID itself is never printed: public logs)
          DEVICES="$($PB -c 'Print :ProvisionedDevices' "$V/embedded.plist" 2>/dev/null || true)"
          [ -n "$DEVICES" ] || fail "Profile type" "The embedded profile lists no devices."
          if [ -n "${IPHONE_UDID:-}" ]; then
            WANT="$(tr '[:lower:]' '[:upper:]' <<< "$IPHONE_UDID")"
            HAVE="$(tr '[:lower:]' '[:upper:]' <<< "$DEVICES")"
            case "$HAVE" in
              *"$WANT"*) echo "the iPhone is in the profile's device list" ;;
              *) fail "Device not in profile" "The iPhone is not in the profile's device list. Register the device, then re-create the profile." ;;
            esac
          else
            echo "IPHONE_UDID secret not set; skipped the device-list check"
          fi

          # 5. expiry
          EXP="$(plutil -extract ExpirationDate raw -o - "$V/embedded.plist")"
          EXP_EPOCH="$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$EXP" +%s)"
          DAYS_LEFT=$(( (EXP_EPOCH - $(date -u +%s)) / 86400 ))
          echo "profile expires $EXP ($DAYS_LEFT days)"
          [ "$DAYS_LEFT" -ge 1 ] || fail "Profile expired" "The embedded profile expired on $EXP."
          [ "$DAYS_LEFT" -ge 14 ] || echo "::warning title=Provisioning profile::expires in $DAYS_LEFT days ($EXP)"

      # Private bucket + the session-protected Onyx /install page. No artifact, no links in the log.
      - name: Publish for over-the-air install
        if: ${{ inputs.publish }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECT_BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: python3 tools/screentime_ios/ci/publish_build.py

      - name: Clean up keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/onyx-signing.keychain-db" || true
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID:-none}.mobileprovision" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-none}.mobileprovision"
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/verify" "$RUNNER_TEMP/export"
