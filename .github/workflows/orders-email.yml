name: Online Orders Email

# Reads shipping / delivery emails (stores, Amazon, UPS / FedEx / USPS) from both Gmail accounts
# and rebuilds pds.online_orders for /orders. Read-only on Gmail (readonly SELECT + BODY.PEEK);
# writes one online_orders|email heartbeat per run for the /status card. The first run (empty
# table) reads 400 days; later runs read 45. Needs sql/online_orders_schema.sql applied first.

on:
  schedule:
    # Every 3 hours at :05. Clear of the hourly ETL (:00), air quality (:12), urgent email (:15),
    # retrain check (:20), flights (:25), journal (:35), delivery (:40), habits (:45), Spotify (:50).
    - cron: '5 */3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window in days (default 45; 400 when the table is empty)'
        required: false
        type: string
      reprocess:
        description: 'Re-parse emails already stored'
        required: false
        type: boolean
        default: false

concurrency:
  group: orders-email
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  orders-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Read shipping emails (read-only IMAP) and rebuild orders
        run: >
          python orders_email_etl.py
          ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
          ${{ inputs.reprocess && '--reprocess' || '' }}
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          # Same mailbox slots as flights-email.yml / delivery-email.yml. An unset pair is skipped.
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          IMAP_EMAIL_2: ${{ secrets.IMAP_EMAIL_2 }}
          IMAP_APP_PASSWORD_2: ${{ secrets.IMAP_APP_PASSWORD_2 }}
          IMAP_EMAIL_3: ${{ secrets.IMAP_EMAIL_3 }}
          IMAP_APP_PASSWORD_3: ${{ secrets.IMAP_APP_PASSWORD_3 }}
          IMAP_EMAIL_4: ${{ secrets.IMAP_EMAIL_4 }}
          IMAP_APP_PASSWORD_4: ${{ secrets.IMAP_APP_PASSWORD_4 }}
          IMAP_EMAIL_5: ${{ secrets.IMAP_EMAIL_5 }}
          IMAP_APP_PASSWORD_5: ${{ secrets.IMAP_APP_PASSWORD_5 }}
