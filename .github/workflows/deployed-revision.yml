name: Confirm deployed revision
# Read-only prerequisite for automated tests. Never deploys, dispatches, or changes data.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
    outputs:
      ready:
        value: ${{ jobs.deployed.outputs.ready }}
permissions:
  contents: read
  deployments: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=Production&per_page=100" --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // "pending"')
            if [ "$state" = success ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'Tests deferred: no successful Production deployment for this exact revision.'
